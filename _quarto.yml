project:
  type: website
  output-dir: _site
  # Author in .qmd; the committed .ipynb copies exist only for the "Open in Colab"
  # buttons, so keep them out of the site render (they'd collide with index.html).
  # The .ipynb are NOT rendered (they would collide with index.html) but they ARE published, beside
  # their page, so `_download-badge.lua` can link to `index.ipynb` as a SAME-ORIGIN href. That is what
  # makes the HTML5 `download` attribute work: cross-origin (raw.githubusercontent, a CDN) the browser
  # ignores it, and raw.githubusercontent serves .ipynb as text/plain so it shows JSON instead of
  # saving a file. Same-origin, one click puts the notebook on disk.
  resources:
    - "examples/**/*.ipynb"
    - "benchmarks/**/*.ipynb"
    - "sanity-checks/**/*.ipynb"
  render:
    - "index.qmd"
    - "examples/**/*.qmd"
    - "benchmarks/**/*.qmd"
    - "sanity-checks/**/*.qmd"
    - "STYLE_GUIDE.md"
    - "ISSUES.md"

