format:
  html:
    theme: cosmo
    toc: true
    code-tools: true
    code-link: true
    highlight-style: github
    fig-cap-location: bottom

# Execute examples locally (or on a GPU runner), commit the cached outputs under
# _freeze/, and let the Pages CI *render only*. This keeps the public build free
# of any GPU / heavy-solver dependency. `quarto render` re-executes a page only
# when its source changes; force a refresh with `quarto render --execute`.
# Adds the "Download notebook" badge next to the Colab badge at RENDER time, so no page source
# changes and no freeze is invalidated. See the header of the filter for why that matters.
filters:
  - _download-badge.lua
  # Meta description from each page's subtitle, at RENDER time for the same freeze reason the
  # badge filter documents. See the header of _landing.lua (also for what was tried and cut).
  - _landing.lua

execute:
  freeze: auto
  # 2x the pixels in every executed figure, with the display size written into the image, so
  # the SITE layout does not change — the figures simply stop being soft on a retina display,
  # and stop having to be enlarged when a release film puts one on a 4K frame.
  # `fig-dpi` alone would NOT work: each page sets its own `figure.dpi` in an rcParams block,
  # which overrides it. See the film's design note, films/QUALITY.md §4.3, in
  # ~/Codes/youtube_publishing.
  # A freeze key is the md5 of the .qmd alone, so this does not invalidate anything: pages
  # keep replaying their current figures and roll over to retina as each is re-executed.
  fig-format: retina

bibliography: references.bib
