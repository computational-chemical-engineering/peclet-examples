name: API check

# Does each gallery page still RUN against the peclet on PyPI?
#
# The Publish job renders from _freeze/ and never imports peclet, by design — so nothing in this
# repo noticed when a release moved the API out from under a page. That is exactly how the suite's
# own landing page shipped a quick start that raised TypeError at 1.0.0. This job executes the
# python chunks of each page against the published wheels; tools/check_pages.py explains why a page
# still running at the timeout counts as past-setup rather than as a failure.
#
# It does NOT re-render anything and never touches _freeze/: a page whose numbers need refreshing is
# a separate, author-run job (RELEASE.md Phase I in the suite).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'          # Mondays, 05:41 UTC — the API can move with no commit here
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      OMP_PROC_BIND: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --changed-since needs the history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cfd-dem pulls peclet-coupling, which four pages import. Everything else here is what the
      # pages plot and render with.
      - name: Install peclet and the pages' stack
        run: |
          python -m pip install --upgrade pip
          pip install "peclet[cfd-dem]" numpy scipy pandas matplotlib pyvista scikit-image \
                      plotly ipython imageio trimesh h5py
          pip install -e .        # peclet_examples, the repo's own helpers
          pip list | grep -i peclet

      # On a PR or a push, only the pages that changed. On a schedule or a manual run, all of them —
      # that is the run that catches a release moving the API with no commit in this repo.
      # Cheap, needs nothing installed, and catches the class that shipped broken to Colab: a page
      # fixed in index.qmd and not in the index.ipynb the badge opens. Always every page.
      - name: The .ipynb mirrors must match their .qmd
        run: python tools/check_pages.py --sync-only

      - name: Check the pages
        run: |
          case "${{ github.event_name }}" in
            pull_request) python tools/check_pages.py --timeout 60 --workers 2 \
                            --changed-since "origin/${{ github.base_ref }}" ;;
            push)         python tools/check_pages.py --timeout 60 --workers 2 \
                            --changed-since HEAD~1 ;;
            *)            python tools/check_pages.py --timeout 60 --workers 2 ;;
          esac
